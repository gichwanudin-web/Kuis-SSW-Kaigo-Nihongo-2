<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Kaigo 2 - Interaktif</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .container {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 850px;
            width: 100%;
            padding: 30px;
        }
        h1 {
            text-align: center;
            color: #4a3f8a;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }
        #startScreen { text-align: center; }
        #startScreen label {
            display: block;
            text-align: left;
            margin: 15px 0 5px;
            font-weight: 600;
            color: #444;
        }
        #startScreen input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            transition: border 0.3s;
        }
        #startScreen input:focus { border-color: #764ba2; outline: none; }
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            padding: 14px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(118, 75, 162, 0.5); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        #quizScreen { display: none; }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .badge {
            background: #f0edff;
            color: #4a3f8a;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .timer {
            background: #ffe0e0;
            color: #c0392b;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
        }
        .timer.warning { background: #ffcccc; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        .progress-bar {
            height: 6px;
            background: #eee;
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        .question-text {
            font-size: 1.05rem;
            color: #333;
            line-height: 1.9;
            margin-bottom: 25px;
            padding: 20px;
            background: #f9f8ff;
            border-left: 5px solid #764ba2;
            border-radius: 10px;
            min-height: 100px;
        }
        .speaker-kaigo { color: #1a5276; font-weight: 600; }
        .speaker-pasien { color: #1e8449; font-weight: 600; }
        .dialog-line { display: block; margin-bottom: 6px; }
        .question-label {
            color: #c0392b;
            font-weight: 700;
            margin-top: 10px;
            display: block;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            display: flex;
            align-items: center;
            padding: 15px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
            line-height: 1.5;
            background: #fff;
        }
        .option:hover { border-color: #764ba2; background: #f9f8ff; }
        .option.selected {
            border-color: #764ba2;
            background: #ede8ff;
            box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.15);
        }
        .option .letter {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 32px;
            height: 32px;
            min-width: 32px;
            background: #eee;
            border-radius: 50%;
            margin-right: 15px;
            font-weight: 700;
            color: #555;
            transition: all 0.2s;
        }
        .option.selected .letter { background: #764ba2; color: #fff; }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 15px;
        }
        .nav-buttons .btn { flex: 1; margin-top: 0; padding: 14px 20px; }
        .nav-buttons .btn.secondary {
            background: #e0e0e0;
            color: #555;
            box-shadow: none;
        }
        .nav-buttons .btn.secondary:hover { background: #d0d0d0; box-shadow: none; }
        #resultScreen { display: none; text-align: center; }
        #resultScreen h2 { color: #4a3f8a; font-size: 2rem; margin-bottom: 10px; }
        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 25px auto;
            color: #fff;
            font-size: 2.5rem;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(118, 75, 162, 0.4);
        }
        .result-detail { font-size: 1.2rem; color: #555; margin: 10px 0; }
        .result-detail strong { color: #4a3f8a; }
        .result-message {
            font-size: 1.1rem;
            color: #666;
            margin: 20px 0;
            padding: 15px;
            background: #f9f8ff;
            border-radius: 10px;
        }
        @media (max-width: 600px) {
            .container { padding: 20px; }
            h1 { font-size: 1.4rem; }
            .question-text { font-size: 0.95rem; padding: 15px; }
            .option { font-size: 0.9rem; padding: 12px 14px; }
            .nav-buttons { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📝 介護日本語テスト 2</h1>

    <div id="startScreen">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" placeholder="Masukkan nama Anda" required>
        <label for="kelas">Kelas</label>
        <input type="text" id="kelas" placeholder="Masukkan kelas Anda" required>
        <button class="btn" id="startBtn" onclick="startQuiz()">Mulai Kuis</button>
    </div>

    <div id="quizScreen">
        <div class="top-bar">
            <span class="badge" id="questionCounter">Soal 1 / 20</span>
            <span class="timer" id="timerDisplay">⏱ 30:00</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="question-text" id="questionText"></div>
        <div class="options" id="optionsContainer"></div>
        <div class="nav-buttons">
            <button class="btn secondary" id="prevBtn" onclick="prevQuestion()">← Sebelumnya</button>
            <button class="btn" id="nextBtn" onclick="nextQuestion()">Selanjutnya →</button>
        </div>
    </div>

    <div id="resultScreen">
        <h2>🎉 Kuis Selesai!</h2>
        <div class="score-circle" id="scoreDisplay">0</div>
        <div class="result-detail" id="resultNama"></div>
        <div class="result-detail" id="resultKelas"></div>
        <div class="result-detail" id="resultDetail"></div>
        <div class="result-message" id="resultMessage"></div>
        <button class="btn" onclick="location.reload()">Ulangi Kuis</button>
    </div>
</div>

<script>

// ==================== VARIABEL GLOBAL ====================
let currentQuestions = [];
let userAnswers = [];
let currentIndex = 0;
let userName = "";
let userClass = "";
let timerInterval = null;
let timeLeft = 30 * 60;

// ==================== FUNGSI ACAK ====================
function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

// ==================== MULAI KUIS ====================
function startQuiz() {
    const namaInput = document.getElementById('nama').value.trim();
    const kelasInput = document.getElementById('kelas').value.trim();

    if (!namaInput || !kelasInput) {
        alert('Silakan isi Nama dan Kelas terlebih dahulu!');
        return;
    }

    userName = namaInput;
    userClass = kelasInput;

    currentQuestions = shuffleArray(questionsData);

    currentQuestions = currentQuestions.map(q => {
        const correctText = q.options[q.correct];
        const shuffledOptions = shuffleArray(q.options);
        const newCorrectIndex = shuffledOptions.indexOf(correctText);
        return {
            q: q.q,
            options: shuffledOptions,
            correct: newCorrectIndex
        };
    });

    userAnswers = new Array(currentQuestions.length).fill(null);
    currentIndex = 0;

    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('quizScreen').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';

    timeLeft = 30 * 60;
    startTimer();
    renderQuestion();
}

// ==================== TIMER ====================
function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    updateTimerDisplay();
    timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            finishQuiz();
        }
    }, 1000);
}

function updateTimerDisplay() {
    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;
    const display = document.getElementById('timerDisplay');
    display.textContent = `⏱ ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    if (timeLeft <= 300) {
        display.classList.add('warning');
    } else {
        display.classList.remove('warning');
    }
}

// ==================== RENDER SOAL ====================
function renderQuestion() {
    const q = currentQuestions[currentIndex];
    const total = currentQuestions.length;

    document.getElementById('questionCounter').textContent = `Soal ${currentIndex + 1} / ${total}`;
    const progress = ((currentIndex + 1) / total) * 100;
    document.getElementById('progressFill').style.width = progress + '%';
    document.getElementById('questionText').innerHTML = q.q;

    const optionsContainer = document.getElementById('optionsContainer');
    optionsContainer.innerHTML = '';
    const letters = ['A', 'B', 'C', 'D'];

    q.options.forEach((opt, idx) => {
        const div = document.createElement('div');
        div.className = 'option';
        if (userAnswers[currentIndex] === idx) {
            div.classList.add('selected');
        }
        div.innerHTML = `
            <span class="letter">${letters[idx]}</span>
            <span>${opt}</span>
        `;
        div.onclick = () => selectOption(idx);
        optionsContainer.appendChild(div);
    });

    document.getElementById('prevBtn').disabled = currentIndex === 0;
    const nextBtn = document.getElementById('nextBtn');
    if (currentIndex === total - 1) {
        nextBtn.textContent = 'Selesai ✓';
    } else {
        nextBtn.textContent = 'Selanjutnya →';
    }
}

// ==================== PILIH OPSI ====================
function selectOption(idx) {
    userAnswers[currentIndex] = idx;
    const options = document.querySelectorAll('.option');
    options.forEach((opt, i) => {
        if (i === idx) {
            opt.classList.add('selected');
        } else {
            opt.classList.remove('selected');
        }
    });
}

// ==================== NAVIGASI ====================
function prevQuestion() {
    if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
    }
}

function nextQuestion() {
    if (currentIndex < currentQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
    } else {
        finishQuiz();
    }
}

// ==================== SELESAI KUIS ====================
function finishQuiz() {
    if (timerInterval) clearInterval(timerInterval);

    let correctCount = 0;
    currentQuestions.forEach((q, idx) => {
        if (userAnswers[idx] === q.correct) {
            correctCount++;
        }
    });

    const total = currentQuestions.length;
    const score = Math.round((correctCount / total) * 100);

    document.getElementById('quizScreen').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';

    document.getElementById('scoreDisplay').textContent = score;
    document.getElementById('resultNama').innerHTML = `Nama: <strong>${userName}</strong>`;
    document.getElementById('resultKelas').innerHTML = `Kelas: <strong>${userClass}</strong>`;
    document.getElementById('resultDetail').innerHTML = `Jawaban Benar: <strong>${correctCount}</strong> / ${total}`;

    let message = '';
    if (score >= 90) message = '🌟 Luar biasa! Anda sangat memahami materi ini.';
    else if (score >= 80) message = '😊 Bagus sekali! Pertahankan ya.';
    else if (score >= 70) message = '👍 Cukup baik. Sedikit lagi belajar.';
    else if (score >= 60) message = '📖 Perlu belajar lagi. Jangan menyerah!';
    else message = '💪 Ayo semangat belajar! Ulangi lagi ya.';

    document.getElementById('resultMessage').textContent = message;
}
</script>
</body>
</html>
